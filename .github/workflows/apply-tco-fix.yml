name: Apply TCO Typecheck Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect staged repair
        id: detect
        shell: bash
        run: |
          if [[ -f tco-fix.patch.b64.part01 && -f tco-fix.patch.b64.part02 && -f tco-fix.patch.b64.part03 && -f tco-fix.patch.b64.part04 ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and validate patch
        if: steps.detect.outputs.apply == 'true'
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          root = Path(".")
          names = [
              "tco-fix.patch.b64.part01",
              "tco-fix.patch.b64.part02",
              "tco-fix.patch.b64.part03",
              "tco-fix.patch.b64.part04",
          ]
          parts = [(root / n).read_text() for n in names]

          # Repair the three character-losses introduced during transport.
          parts[0] = parts[0][:9162] + "/T" + parts[0][9162:]
          parts[0] = parts[0].replace("S5XYLJR", "S5XYJLR").replace("GfWgnn", "GfGwnn")
          parts[2] = parts[2][:9169] + "9" + parts[2][9169:]
          parts[2] = parts[2][:11417] + "k" + parts[2][11417:]
          parts[3] = parts[3][:3653] + "S" + parts[3][3653:]

          payload = "".join(parts)
          expected_sha256 = "b1b6f83cedbdca09eb893e6f1d9804b6fd1454a78cebcdc139f3618997829607"
          print("corrected part hashes:")
          for i, part in enumerate(parts, 1):
              print(i, len(part), hashlib.sha256(part.encode()).hexdigest())
          actual_sha256 = hashlib.sha256(payload.encode()).hexdigest()
          print("payload sha256:", actual_sha256)
          if actual_sha256 != expected_sha256:
              raise SystemExit(f"patch payload hash mismatch: {actual_sha256}")

          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          Path("/tmp/tco-fix.patch").write_bytes(patch)

          actual_patch_sha256 = hashlib.sha256(patch).hexdigest()
          print("reconstructed patch bytes:", len(patch))
          print("reconstructed patch sha256:", actual_patch_sha256)
          # The compressed payload hash above is the authoritative transport gate.
          PY

      - name: Validate patch applicability
        if: steps.detect.outputs.apply == 'true'
        run: git apply --check --3way /tmp/tco-fix.patch

      - name: Apply repair
        if: steps.detect.outputs.apply == 'true'
        run: git apply --index --3way /tmp/tco-fix.patch

      - name: Commit repaired source
        if: steps.detect.outputs.apply == 'true'
        shell: bash
        run: |
          rm -f tco-fix.patch.b64.part01 tco-fix.patch.b64.part02 tco-fix.patch.b64.part03 tco-fix.patch.b64.part04 .github/workflows/apply-tco-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: repair TradingCoreOS type contracts and runtime boundaries"
          git push origin HEAD:main
