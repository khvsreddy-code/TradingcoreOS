name: Apply indicator settings polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch indicator settings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/workspace/IndicatorDock.tsx')
          s=p.read_text()
          s=s.replace("import { IndicatorConfig, INDICATOR_LIBRARY } from '../../services/marketData/indicatorEngine';", "import { IndicatorConfig, INDICATOR_LIBRARY, PRICE_SOURCES } from '../../services/marketData/indicatorEngine';")
          s=s.replace("const fmtConfig = (x: IndicatorConfig) => {", "const anchorOptions = ['Swing High','Swing Low','Day Start','Week Start','Month Start','Visible Range Start','Manual Time'];\nconst periodKinds = new Set(['EMA','SMA','HMA','RSI','ATR','ADX','CCI','MFI','Bollinger Bands','Keltner Channels','Donchian Channels','Supertrend','Stochastic','Market Structure','Swing Levels','Opening Range','Opening Range Pro','Equal Highs/Lows','Liquidity Pools','Order Blocks','Order Blocks + Mitigation','Breakout / Retest','Failed Breakout']);\nconst sourceKinds = new Set(['EMA','SMA','HMA','VWAP','Bollinger Bands','Keltner Channels','RSI','CCI','MFI','OBV','Anchored VWAP','VWAP Deviation Bands']);\nconst fmtConfig = (x: IndicatorConfig) => {")
          old="""              {isEditing && <div className=\"grid grid-cols-2 gap-2 border-t border-[#222636] px-2.5 py-2.5 text-[8px] text-[#8c93a6]\">\n                {['EMA','SMA','HMA','RSI','ATR','ADX','CCI','MFI','Bollinger Bands','Keltner Channels','Donchian Channels','Supertrend','Stochastic','Market Structure','Swing Levels','Opening Range','Opening Range Pro','Equal Highs/Lows','Liquidity Pools','Order Blocks','Order Blocks + Mitigation','Anchored VWAP'].includes(x.kind) && <label>Period<input type=\"number\" min=\"2\" max=\"500\" value={x.period ?? 14} onChange={e => patch(x.id, { period: Math.max(2, Number(e.target.value) || 2) })} className=\"mt-1 w-full rounded border border-[#222636] bg-[#080a10] p-1.5 text-[10px] text-white outline-none\"/></label>}\n                {['Bollinger Bands','Keltner Channels','Supertrend','VWAP Deviation Bands'].includes(x.kind) && <label>Multiplier<input type=\"number\" step=\"0.1\" min=\"0.5\" max=\"10\" value={x.multiplier ?? 2} onChange={e => patch(x.id, { multiplier: Number(e.target.value) || 2 })} className=\"mt-1 w-full rounded border border-[#222636] bg-[#080a10] p-1.5 text-[10px] text-white outline-none\"/></label>}\n                {x.kind === 'MACD' && <><label>Fast<input type=\"number\" min=\"2\" value={x.fast ?? 12} onChange={e => patch(x.id, { fast: Number(e.target.value) || 12 })} className=\"mt-1 w-full rounded border border-[#222636] bg-[#080a10] p-1.5 text-[10px] text-white outline-none\"/></label><label>Slow<input type=\"number\" min=\"3\" value={x.slow ?? 26} onChange={e => patch(x.id, { slow: Number(e.target.value) || 26 })} className=\"mt-1 w-full rounded border border-[#222636] bg-[#080a10] p-1.5 text-[10px] text-white outline-none\"/></label><label>Signal<input type=\"number\" min=\"2\" value={x.signal ?? 9} onChange={e => patch(x.id, { signal: Number(e.target.value) || 9 })} className=\"mt-1 w-full rounded border border-[#222636] bg-[#080a10] p-1.5 text-[10px] text-white outline-none\"/></label></>}\n                {x.kind === 'Stochastic' && <><label>Smoothing<input type=\"number\" min=\"1\" value={x.smooth ?? 3} onChange={e => patch(x.id, { smooth: Number(e.target.value) || 3 })} className=\"mt-1 w-full rounded border border-[#222636] bg-[#080a10] p-1.5 text-[10px] text-white outline-none\"/></label><label>Signal<input type=\"number\" min=\"1\" value={x.signal ?? 3} onChange={e => patch(x.id, { signal: Number(e.target.value) || 3 })} className=\"mt-1 w-full rounded border border-[#222636] bg-[#080a10] p-1.5 text-[10px] text-white outline-none\"/></label></>}\n                {x.kind === 'Ichimoku Cloud' && <><label>Conversion<input type=\"number\" min=\"2\" value={x.period ?? 9} onChange={e => patch(x.id, { period: Number(e.target.value) || 9 })} className=\"mt-1 w-full rounded border border-[#222636] bg-[#080a10] p-1.5 text-[10px] text-white outline-none\"/></label><label>Base<input type=\"number\" min=\"3\" value={x.slow ?? 26} onChange={e => patch(x.id, { slow: Number(e.target.value) || 26 })} className=\"mt-1 w-full rounded border border-[#222636] bg-[#080a10] p-1.5 text-[10px] text-white outline-none\"/></label></>}\n              </div>}"""
          new="""              {isEditing && <div className=\"space-y-2 border-t border-[#222636] px-2.5 py-2.5 text-[8px] text-[#8c93a6]\">\n                {sourceKinds.has(x.kind) && <label className=\"block\">Price Source<select value={x.source || 'close'} onChange={e => patch(x.id, { source: e.target.value as any })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] px-2 py-1.5 text-[10px] text-white outline-none\">{PRICE_SOURCES.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}</select></label>}\n                {x.kind === 'Anchored VWAP' && <label className=\"block\">Anchor From<select value={(x as any).anchor || 'Swing High'} onChange={e => patch(x.id, { ...(x as any), anchor: e.target.value } as any)} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] px-2 py-1.5 text-[10px] text-white outline-none\">{anchorOptions.map(v => <option key={v}>{v}</option>)}</select></label>}\n                {periodKinds.has(x.kind) && <label className=\"block\">{x.kind === 'Opening Range' || x.kind === 'Opening Range Pro' ? 'Range Duration (minutes)' : 'Period'}<input type=\"number\" min=\"1\" max=\"500\" value={x.period ?? 14} onChange={e => patch(x.id, { period: Math.max(1, Number(e.target.value) || 1) })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] px-2 py-1.5 text-[10px] text-white outline-none\"/></label>}\n                {['Bollinger Bands','Keltner Channels','Supertrend','VWAP Deviation Bands'].includes(x.kind) && <label className=\"block\">{x.kind === 'VWAP Deviation Bands' ? 'Deviation Multiplier' : 'Multiplier'}<input type=\"number\" step=\"0.1\" min=\"0.1\" max=\"10\" value={x.multiplier ?? 2} onChange={e => patch(x.id, { multiplier: Number(e.target.value) || 2 })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] px-2 py-1.5 text-[10px] text-white outline-none\"/></label>}\n                {x.kind === 'MACD' && <div className=\"grid grid-cols-3 gap-2\"><label>Fast<input type=\"number\" min=\"2\" value={x.fast ?? 12} onChange={e => patch(x.id, { fast: Number(e.target.value) || 12 })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] p-1.5 text-[10px] text-white\"/></label><label>Slow<input type=\"number\" min=\"3\" value={x.slow ?? 26} onChange={e => patch(x.id, { slow: Number(e.target.value) || 26 })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] p-1.5 text-[10px] text-white\"/></label><label>Signal<input type=\"number\" min=\"2\" value={x.signal ?? 9} onChange={e => patch(x.id, { signal: Number(e.target.value) || 9 })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] p-1.5 text-[10px] text-white\"/></label></div>}\n                {x.kind === 'Stochastic' && <div className=\"grid grid-cols-2 gap-2\"><label>%K Period<input type=\"number\" min=\"1\" value={x.period ?? 14} onChange={e => patch(x.id, { period: Number(e.target.value) || 14 })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] p-1.5 text-[10px] text-white\"/></label><label>%D Smoothing<input type=\"number\" min=\"1\" value={x.smooth ?? 3} onChange={e => patch(x.id, { smooth: Number(e.target.value) || 3 })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] p-1.5 text-[10px] text-white\"/></label></div>}\n                {x.kind === 'Ichimoku Cloud' && <div className=\"grid grid-cols-3 gap-2\"><label>Conversion<input type=\"number\" min=\"2\" value={x.period ?? 9} onChange={e => patch(x.id, { period: Number(e.target.value) || 9 })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] p-1.5 text-[10px] text-white\"/></label><label>Base<input type=\"number\" min=\"3\" value={x.slow ?? 26} onChange={e => patch(x.id, { slow: Number(e.target.value) || 26 })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] p-1.5 text-[10px] text-white\"/></label><label>Displacement<input type=\"number\" min=\"1\" value={x.displacement ?? 26} onChange={e => patch(x.id, { displacement: Number(e.target.value) || 26 })} className=\"mt-1 w-full rounded-md border border-[#252b38] bg-[#080a10] p-1.5 text-[10px] text-white\"/></label></div>}\n                {['Pivot Points','CPR','Key Levels','Weekly Levels','Previous Day Levels','Previous Week Levels','Previous Month Levels','CPR R1-R5 / S1-S5','Camarilla Pivots','Fibonacci Pivots','Weekly Pivots','Monthly Pivots','Fair Value Gaps','FVG + Mitigation','Gap Levels','Gap Zones','Developing Day High/Low','Rejection Candles','Inside Bar Breakout','Engulfing Patterns','Pin Bars','NR7 Volatility Contraction'].includes(x.kind) && <div className=\"rounded-md border border-[#252b38] bg-[#0d1119] px-2 py-2 text-[8px] text-[#64748b]\">Native session/pattern settings — no unrelated period control.</div>}\n              </div>}"""
          if old not in s: raise SystemExit('expected settings block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/workspace/IndicatorDock.tsx
          git rm .github/workflows/apply-indicator-settings.yml
          git commit -m "fix(indicators): correct settings controls [skip ci]"
          git push
