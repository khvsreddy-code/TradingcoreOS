name: TradingCoreOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install WASM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Rebuild numerical kernels from source
        run: npm run build:corespirit:wasm
      - name: Run contract suite (VM differential + backend parity)
        run: npm run test:contracts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build and bundle budgets
        run: npm run build
      - name: Benchmark WASM kernels against CPU references
        env:
          TCO_BENCH_BAR_COUNTS: 50000,250000
          TCO_BENCH_ITERATIONS: 5
        run: npm run benchmark:corespirit:wasm 2>&1 | tee core-spirit-wasm-benchmark.txt
      - name: Archive backend benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-spirit-wasm-benchmark-${{ github.sha }}
          path: core-spirit-wasm-benchmark.txt
          if-no-files-found: warn
          retention-days: 14
