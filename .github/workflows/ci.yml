name: TradingCoreOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Verify CoreSpirit ownership boundaries
        run: node --loader ./tools/nodeTsTranspileLoader.mjs src/coreSpiritNonNegotiableArchitectureContract.test.mjs
      - name: Install WASM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Rebuild numerical kernels from source
        run: npm run build:corespirit:wasm
      - name: Validate Python ML service and CoreSpirit trainer syntax
        run: python -m py_compile ml/app/main.py ml/app/runtime.py ml/app/corespirit_training.py ml/test_corespirit_training.py
      - name: Run contract suite (VM differential + backend parity)
        run: npm run test:contracts
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Build standalone realtime gateway container
        run: docker build --file realtime-gateway/Dockerfile --tag tradingcoreos-realtime-gateway:${{ github.sha }} .
      - name: Production build and bundle budgets
        run: npm run build
      - name: Benchmark WASM kernels against CPU references
        env:
          TCO_BENCH_BAR_COUNTS: 50000,250000
          TCO_BENCH_ITERATIONS: 5
        run: npm run benchmark:corespirit:wasm 2>&1 | tee core-spirit-wasm-benchmark.txt
      - name: Archive backend benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-spirit-wasm-benchmark-${{ github.sha }}
          path: core-spirit-wasm-benchmark.txt
          if-no-files-found: warn
          retention-days: 14
