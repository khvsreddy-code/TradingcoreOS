name: TradingCoreOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Verify CoreSpirit ownership boundaries
        run: node --loader ./tools/nodeTsTranspileLoader.mjs src/coreSpiritNonNegotiableArchitectureContract.test.mjs
      - name: Install WASM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Rebuild numerical kernels from source
        run: npm run build:corespirit:wasm
      - name: Validate Python ML service and CoreSpirit trainer syntax
        run: python -m py_compile ml/app/main.py ml/app/runtime.py ml/app/corespirit_training.py ml/test_corespirit_training.py
      - name: Run contract suite (VM differential + backend parity)
        run: npm run test:contracts
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Build standalone realtime gateway container
        if: always()
        run: docker build --file realtime-gateway/Dockerfile --tag tradingcoreos-realtime-gateway:${{ github.sha }} .
      - name: Production build and bundle budgets
        if: always()
        run: npx vite build && npm run bundle:budget
      - name: Benchmark WASM kernels against CPU references
        if: always()
        env:
          TCO_BENCH_BAR_COUNTS: 50000,250000
          TCO_BENCH_ITERATIONS: 5
        run: npm run benchmark:corespirit:wasm 2>&1 | tee core-spirit-wasm-benchmark.txt
      - name: Archive backend benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-spirit-wasm-benchmark-${{ github.sha }}
          path: core-spirit-wasm-benchmark.txt
          if-no-files-found: warn
          retention-days: 14

  # Enable only after the authenticated browser URL and storage-state secret are set.
  browser-performance:
    name: browser-performance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TCO_BROWSER_PERF_ENABLED: ${{ vars.TCO_BROWSER_PERF_ENABLED }}
      TCO_BROWSER_BASE_URL: ${{ vars.TCO_BROWSER_BASE_URL }}
      TCO_BROWSER_STATE_BASE64: ${{ secrets.TCO_BROWSER_STATE_BASE64 }}
      TCO_BROWSER_STATE_FILE: ${{ runner.temp }}/tco-browser-state.json
      TCO_BROWSER_CHROMIUM_ARGS: '--enable-precise-memory-info'
      TCO_BROWSER_SOAK_MS: '30000'
      TCO_BROWSER_SETTLE_MS: '5000'
      TCO_MAX_P95_FRAME_MS: '16.7'
      TCO_MAX_TICK_TO_COMPUTE_P95_MS: '8'
      TCO_MAX_TICK_TO_PATCH_P95_MS: '16.7'
      TCO_MAX_TICK_TO_RENDER_P95_MS: '16.7'
      TCO_MAX_LONG_TASKS_DURING_SOAK: '0'
      TCO_REQUIRE_HEAP_METRICS: 'true'
      TCO_MAX_HEAP_TREND_GROWTH_BYTES: '33554432'
      TCO_MIN_HEAP_SAMPLE_WINDOW_MS: '10000'
      TCO_REQUIRE_SHARED_MEMORY: 'true'
    steps:
      - name: Evaluate browser-performance gate
        id: gate
        shell: bash
        run: |
          if [ "$TCO_BROWSER_PERF_ENABLED" = "true" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Browser-performance gate is not enabled
        if: steps.gate.outputs.enabled != 'true'
        run: echo "Set TCO_BROWSER_PERF_ENABLED=true and configure the browser URL/state secret to activate this check."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24
      - name: Validate authenticated browser configuration
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          test -n "$TCO_BROWSER_BASE_URL" || { echo "Set repository variable TCO_BROWSER_BASE_URL to the authenticated /live URL."; exit 1; }
          test -n "$TCO_BROWSER_STATE_BASE64" || { echo "Set repository secret TCO_BROWSER_STATE_BASE64 to agent-browser storage-state JSON."; exit 1; }
          umask 077
          printf '%s' "$TCO_BROWSER_STATE_BASE64" | base64 --decode > "$TCO_BROWSER_STATE_FILE"
          test -s "$TCO_BROWSER_STATE_FILE"
      - name: Install agent-browser and Chromium
        if: steps.gate.outputs.enabled == 'true'
        run: |
          npm install --global agent-browser@0.38.2
          agent-browser install --with-deps
      - name: Verify 1 / 4 / 8 chart layouts under live market load
        if: steps.gate.outputs.enabled == 'true'
        run: npm run verify:browser:strict 2>&1 | tee browser-performance-matrix.json
      - name: Archive browser-performance evidence
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-performance-matrix-${{ github.sha }}
          path: browser-performance-matrix.json
          if-no-files-found: warn
          retention-days: 30
