name: TradingCoreOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:contracts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run bundle:budget
      - name: Browser smoke (real Vela runtime)
        run: |
          npm install --no-save --no-audit --no-fund agent-browser
          PORT=3000 NODE_ENV=test npm run dev > /tmp/tradingcoreos.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health/live >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health/live >/dev/null
          npm run verify:browser:smoke
