name: TradingCore workspace patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply workspace reliability fixes
        shell: python
        run: |
          from pathlib import Path

          live = Path('src/components/workspace/LiveChart.tsx')
          s = live.read_text()
          s = s.replace(
              "type Props={instrumentKey:string;brokerId?:string;tick?:NormalizedMarketTick;onAnalytics?:(a:ChartAnalytics)=>void};",
              "type Props={instrumentKey:string;brokerId?:string;tick?:NormalizedMarketTick;onAnalytics?:(a:ChartAnalytics)=>void;levelsRequest?:number};"
          )
          s = s.replace(
              "export function LiveChart({instrumentKey,brokerId='unknown',tick,onAnalytics}:Props){",
              "export function LiveChart({instrumentKey,brokerId='unknown',tick,onAnalytics,levelsRequest}:Props){"
          )
          state_line = " const [timeframe,setTimeframe]=useState('5m'),[showLevels,setShowLevels]=useState(false),[showVolume,setShowVolume]=useState(false),[showOI,setShowOI]=useState(false),[showDepth,setShowDepth]=useState(false),[showIndicatorMenu,setShowIndicatorMenu]=useState(false),[editingIndicator,setEditingIndicator]=useState<string|null>(null),[indicators,setIndicators]=useState<IndicatorConfig[]>(getIndicators),[automations,setAutomations]=useState<AutomationConfig[]>(getAutomations),[error,setError]=useState('');"
          if "setShowLevels(true);},[levelsRequest]" not in s and state_line in s:
              s = s.replace(state_line, state_line + "\n useEffect(()=>{if(levelsRequest==null)return;setShowLevels(true);},[levelsRequest]);")
          s = s.replace(
              "c.timeScale().fitContent();",
              "c.timeScale().fitContent(); if(showOI&&oiAnalytics.current)renderOI(oiAnalytics.current);"
          )
          old_oi = "useEffect(()=>{let dead=false; refreshOI(); const id=window.setInterval(()=>{if(!dead)refreshOI();},5000); return()=>{dead=true;window.clearInterval(id);oiLines.current.forEach(x=>{try{candle.current?.removePriceLine(x)}catch{}});oiLines.current=[]};},[instrumentKey]);"
          new_oi = "useEffect(()=>{if(!showOI)return;let dead=false; void refreshOI(); const id=window.setInterval(()=>{if(!dead)void refreshOI();},15000); return()=>{dead=true;window.clearInterval(id);};},[instrumentKey,showOI,brokerId]);"
          if old_oi in s:
              s = s.replace(old_oi, new_oi)
          live.write_text(s)

          page = Path('src/components/workspace/FullWorkspaceView.tsx')
          s = page.read_text()
          s = s.replace(
              "  const [activeSection, setActiveSection] = useState<'info' | 'option-chain' | 'positions' | 'orders' | 'levels' | 'signals'>('info');\n",
              "  const [activeSection, setActiveSection] = useState<'info' | 'option-chain' | 'positions' | 'orders' | 'levels' | 'signals'>('info');\n  const [levelsRequest, setLevelsRequest] = useState(0);\n"
          )
          s = s.replace("if (!showInstrumentSearch || q.length < 1)", "if (!showInstrumentSearch || q.length < 2)")
          s = s.replace(
              "onClick={() => setActiveSection(id as typeof activeSection)}",
              "onClick={() => { setActiveSection(id as typeof activeSection); if ((id as string) === 'levels') setLevelsRequest(v => v + 1); }}"
          )
          s = s.replace(
              "<LiveChart key={`${brokerId}:${selectedKey}`} instrumentKey={selectedKey} brokerId={brokerId} tick={selectedTick} onAnalytics={setAnalytics} />",
              "<LiveChart key={`${brokerId}:${selectedKey}`} instrumentKey={selectedKey} brokerId={brokerId} tick={selectedTick} levelsRequest={levelsRequest} onAnalytics={setAnalytics} />"
          )
          page.write_text(s)

      - name: Commit workspace patch
        shell: bash
        run: |
          git config user.name "TradingCore Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/workspace/LiveChart.tsx src/components/workspace/FullWorkspaceView.tsx
          if git diff --cached --quiet; then
            echo "No workspace changes required"
            exit 0
          fi
          git commit -m "fix: stabilize OI and Levels controls"
          git push
