name: Rebuild CoreSpirit WASM
on:
  push:
    branches: [main]
    paths:
      - "src/services/coreSpirit/wasm-kernels/rolling_mean_simd.c"
      - "tools/build-core-spirit-wasm.sh"
      - ".github/workflows/rebuild-core-spirit-wasm.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install WebAssembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build validated kernel module
        run: sh tools/build-core-spirit-wasm.sh
      - name: Commit regenerated module if changed
        run: |
          if git diff --quiet -- public/coreSpirit/numerical-kernels-simd.wasm; then
            echo "WASM artifact is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coreSpirit/numerical-kernels-simd.wasm
          git commit -m "build: regenerate CoreSpirit WASM module"
          git push origin HEAD:main
