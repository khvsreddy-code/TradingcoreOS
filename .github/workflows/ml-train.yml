name: TradingCoreOS ML training
on:
  workflow_dispatch:
    inputs:
      csv_url:
        description: 'HTTPS CSV URL containing OHLCV candles from an approved host'
        required: true
        type: string
      symbol:
        description: 'Path-safe TradingCoreOS symbol key'
        required: true
        default: 'NIFTY50'
        type: string
      timeframe:
        description: 'Training timeframe (for example 5m or 1D)'
        required: true
        default: '1D'
        type: string
      horizon:
        description: 'Prediction horizon in candles (1-500)'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      - name: Run standard-library input-security tests
        run: python ml/test_training_input.py
      - name: Validate run identity before creating output paths
        env:
          SYMBOL: ${{ inputs.symbol }}
          TIMEFRAME: ${{ inputs.timeframe }}
          HORIZON: ${{ inputs.horizon }}
        run: python ml/training_input.py validate-identity --symbol "$SYMBOL" --timeframe "$TIMEFRAME" --horizon "$HORIZON"
      - name: Install pinned ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Verify inference service authentication fails closed
        run: python ml/test_ml_service_auth.py
      - name: Verify CoreSpirit trains immutable Python XGBoost candidates
        run: python ml/test_corespirit_training.py
      - name: Download and validate user-supplied CSV
        env:
          CSV_URL: ${{ inputs.csv_url }}
          ML_TRAINING_ALLOWED_HOSTS: ${{ vars.ML_TRAINING_ALLOWED_HOSTS }}
          TRAINING_CSV: ${{ runner.temp }}/training.csv
        run: python ml/training_input.py download --url "$CSV_URL" --output "$TRAINING_CSV"
      - name: Train into an isolated temporary directory
        env:
          SYMBOL: ${{ inputs.symbol }}
          TIMEFRAME: ${{ inputs.timeframe }}
          HORIZON: ${{ inputs.horizon }}
          TRAINING_CSV: ${{ runner.temp }}/training.csv
          MODEL_ROOT: ${{ runner.temp }}/tradingcoreos-model-output
        run: python ml/train.py --csv "$TRAINING_CSV" --symbol "$SYMBOL" --timeframe "$TIMEFRAME" --horizon "$HORIZON" --out "$MODEL_ROOT"
      - name: Validate candidate artifacts and reject partial or blocked models
        env:
          SYMBOL: ${{ inputs.symbol }}
          TIMEFRAME: ${{ inputs.timeframe }}
          MODEL_ROOT: ${{ runner.temp }}/tradingcoreos-model-output
          ARTIFACT_ROOT: ${{ runner.temp }}/tradingcoreos-candidate-artifacts
        run: python ml/validate_artifacts.py --models-root "$MODEL_ROOT" --symbol "$SYMBOL" --timeframe "$TIMEFRAME" --out "$ARTIFACT_ROOT"
      - name: Upload reviewed-promotion-required candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tradingcoreos-ml-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/tradingcoreos-candidate-artifacts/
          if-no-files-found: error
          retention-days: 14
