name: Authenticated Vela 1-4-8 Evidence

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Authenticated TCO deployment URL'
        required: true
        type: string
      layouts:
        description: 'Vela layouts to verify'
        required: false
        default: '1,4,8'
        type: string

jobs:
  chart-matrix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TCO_E2E_BASE_URL: ${{ inputs.base_url }}
      TCO_E2E_LAYOUTS: ${{ inputs.layouts }}
      TCO_E2E_STATE_FILE: ${{ runner.temp }}/tco-auth-state.json
      TCO_E2E_OUTPUT_DIR: artifacts/tco-chart-matrix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Restore authenticated browser state
        env:
          TCO_E2E_STORAGE_STATE_B64: ${{ secrets.TCO_E2E_STORAGE_STATE_B64 }}
        run: |
          test -n "${TCO_E2E_STORAGE_STATE_B64}"
          printf '%s' "${TCO_E2E_STORAGE_STATE_B64}" | base64 --decode > "${TCO_E2E_STATE_FILE}"
          chmod 600 "${TCO_E2E_STATE_FILE}"

      - name: Install agent-browser
        run: |
          npm install --global agent-browser
          agent-browser install

      - name: Run authenticated Vela matrix
        run: node tools/verify-authenticated-chart-matrix.mjs

      - name: Upload Vela evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tco-vela-1-4-8-evidence
          path: artifacts/tco-chart-matrix
          if-no-files-found: warn
          retention-days: 14
