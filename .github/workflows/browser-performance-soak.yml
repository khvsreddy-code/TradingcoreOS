name: TradingCoreOS Browser Performance Soak

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradingcoreos-browser-performance-soak
  cancel-in-progress: false

jobs:
  browser-performance-soak:
    name: browser-performance-soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TCO_BROWSER_PERF_ENABLED: ${{ vars.TCO_BROWSER_PERF_ENABLED }}
      TCO_BROWSER_BASE_URL: ${{ vars.TCO_BROWSER_BASE_URL }}
      TCO_BROWSER_STATE_BASE64: ${{ secrets.TCO_BROWSER_STATE_BASE64 }}
      TCO_BROWSER_STATE_FILE: ${{ runner.temp }}/tco-browser-state.json
      TCO_BROWSER_CHROMIUM_ARGS: '--enable-precise-memory-info'
      TCO_BROWSER_URLS: ${{ vars.TCO_BROWSER_BASE_URL }}?velaLayout=8
      TCO_EXPECTED_CELLS: '8'
      TCO_REQUIRE_AUTH: 'true'
      TCO_BROWSER_SETTLE_MS: '5000'
      TCO_BROWSER_SOAK_MS: '1800000'
      TCO_MAX_P95_FRAME_MS: '16.7'
      TCO_MAX_TICK_TO_COMPUTE_P95_MS: '8'
      TCO_MAX_TICK_TO_PATCH_P95_MS: '16.7'
      TCO_MAX_TICK_TO_RENDER_P95_MS: '16.7'
      TCO_MAX_LONG_TASKS_DURING_SOAK: '0'
      TCO_REQUIRE_HEAP_METRICS: 'true'
      TCO_MAX_HEAP_TREND_GROWTH_BYTES: '33554432'
      TCO_MIN_HEAP_SAMPLE_WINDOW_MS: '1800000'
      TCO_REQUIRE_SHARED_MEMORY: 'true'
    steps:
      - name: Evaluate soak gate
        id: gate
        shell: bash
        run: |
          if [ "$TCO_BROWSER_PERF_ENABLED" = "true" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Soak gate is not enabled
        if: steps.gate.outputs.enabled != 'true'
        run: echo "Set TCO_BROWSER_PERF_ENABLED=true and configure browser URL/state before enabling the 30-minute soak."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24
      - name: Validate authenticated market-session browser state
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          test -n "$TCO_BROWSER_BASE_URL" || { echo "Set repository variable TCO_BROWSER_BASE_URL to the authenticated /live URL."; exit 1; }
          test -n "$TCO_BROWSER_STATE_BASE64" || { echo "Set repository secret TCO_BROWSER_STATE_BASE64 to agent-browser storage-state JSON."; exit 1; }
          umask 077
          printf '%s' "$TCO_BROWSER_STATE_BASE64" | base64 --decode > "$TCO_BROWSER_STATE_FILE"
          test -s "$TCO_BROWSER_STATE_FILE"
      - name: Install agent-browser and Chromium
        if: steps.gate.outputs.enabled == 'true'
        run: |
          npm install --global agent-browser@0.38.2
          agent-browser install --with-deps
      - name: Verify 30-minute 8-chart steady state
        if: steps.gate.outputs.enabled == 'true'
        run: node tools/verify-chart-performance.mjs 2>&1 | tee browser-performance-soak.json
      - name: Archive browser performance evidence
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-performance-soak-${{ github.sha }}
          path: browser-performance-soak.json
          if-no-files-found: warn
          retention-days: 30
